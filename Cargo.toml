[workspace]
members = ["."]

[package]
name = "the-scribes-ledger"
version = "1.0.2"
edition = "2021"
description = "The Scribe's Ledger - Novel Studio"

[lib]
name = "the_scribes_ledger"
path = "src/lib.rs"

[[bin]]
name = "the-scribes-ledger"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
